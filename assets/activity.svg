<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity for YOUR_USERNAME</title>
  <desc id="desc">0 total contributions, 0 day longest streak, and a radar chart of contribution types.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0f1f"/><stop offset="1" stop-color="#17112a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill:#8b96ad; font-size:14px; letter-spacing:2px; text-transform:uppercase; }
      .big { fill:#f8fafc; font-size:42px; font-weight:750; }
      .label { fill:#9aa7bd; font-size:15px; }
      .radar-label { fill:#cbd5e1; font-size:14px; font-weight:600; }
      .radar-value { fill:#67e8f9; font-size:12px; font-weight:500; }
      .grid polygon, .grid line { fill:none; stroke:#526078; stroke-width:1; opacity:.48; }
      .shape { transform-box:fill-box; transform-origin:center; animation:grow 1s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform:scale(.05); opacity:0 } to { transform:scale(1); opacity:1 } }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="438" rx="24" fill="url(#bg)" stroke="#27334a" stroke-width="2"/>
  <rect x="34" y="32" width="932" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="54" y="75" class="eyebrow">GITHUB · YOUR_USERNAME</text>
  <text x="54" y="122" fill="#f8fafc" font-size="25" font-weight="700">Activity snapshot</text>
  <text x="54" y="151" class="label">All-time progress + 2026 contribution mix</text>
  <line x1="490" y1="70" x2="490" y2="370" stroke="#27334a"/>

  <text x="54" y="219" class="big">0</text>
  <text x="54" y="246" class="label">total contributions</text>
  <text x="283" y="219" class="big">0</text>
  <text x="283" y="246" class="label">day longest streak</text>

  <rect x="54" y="286" width="382" height="70" rx="14" fill="#111a2c" stroke="#27334a"/>
  <circle cx="82" cy="321" r="7" fill="#67e8f9" filter="url(#glow)"/>
  <text x="103" y="316" fill="#dbeafe" font-size="15" font-weight="600">Contribution radar</text>
  <text x="103" y="339" class="label">Log scale up to 10 · updated automatically</text>

  <g class="grid"><polygon points="760.0,174.3 792.1,197.6 779.8,235.3 740.2,235.3 727.9,197.6" /><polygon points="760.0,140.5 824.2,187.1 799.7,262.6 720.3,262.6 695.8,187.1" /><polygon points="760.0,106.8 856.3,176.7 819.5,289.9 700.5,289.9 663.7,176.7" /><polygon points="760.0,73.0 888.4,166.3 839.4,317.2 680.6,317.2 631.6,166.3" /><line x1="760" y1="208" x2="760.0" y2="73.0" /><line x1="760" y1="208" x2="888.4" y2="166.3" /><line x1="760" y1="208" x2="839.4" y2="317.2" /><line x1="760" y1="208" x2="680.6" y2="317.2" /><line x1="760" y1="208" x2="631.6" y2="166.3" /></g>
  <polygon class="shape" points="760.0,197.2 770.3,204.7 766.3,216.7 753.7,216.7 749.7,204.7" fill="url(#accent)" fill-opacity=".38" stroke="#67e8f9" stroke-width="2.5" filter="url(#glow)"/>
  <text x="760.0" y="33.0" text-anchor="middle" class="radar-label">Commits<tspan x="760.0" dy="18" class="radar-value">0</tspan></text><text x="924.5" y="159.5" text-anchor="start" class="radar-label">Issues<tspan x="924.5" dy="18" class="radar-value">0</tspan></text><text x="861.7" y="353.0" text-anchor="start" class="radar-label">Pull requests<tspan x="861.7" dy="18" class="radar-value">0</tspan></text><text x="658.3" y="353.0" text-anchor="end" class="radar-label">Reviews<tspan x="658.3" dy="18" class="radar-value">0</tspan></text><text x="595.5" y="159.5" text-anchor="end" class="radar-label">Repositories<tspan x="595.5" dy="18" class="radar-value">0</tspan></text>
  <rect x="545" y="178" width="430" height="62" rx="14" fill="#0a0f1f" fill-opacity=".92" stroke="#8b5cf6"/><text x="760" y="205" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="650">Live data will appear after the first workflow run</text><text x="760" y="226" text-anchor="middle" class="label">Actions → Update profile activity → Run workflow</text>
  <text x="54" y="404" class="label">Data source: GitHub GraphQL API</text>
  <text x="946" y="404" text-anchor="end" class="label">generated 2026-09-03</text>
</svg>