    <g><text class="bit bit-dim" x="660" y="107"><tspan x="660">1</tspan><tspan x="660" dy="14">0</tspan><tspan x="660" dy="14">1</tspan><tspan x="660" dy="14">0</tspan><tspan x="660" dy="14">1</tspan><tspan x="660" dy="14">0</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -32;0 -32;0 120;0 158" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
