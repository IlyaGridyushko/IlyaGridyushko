<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Animated developer terminal</title>
  <desc id="desc">A terminal window types JavaScript and prints Hello, World.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#11182b"/>
      <stop offset="1" stop-color="#17112a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="line1"><rect x="72" y="91" width="0" height="28"><animate attributeName="width" values="0;700;700" keyTimes="0;0.62;1" dur="5.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="72" y="133" width="0" height="28"><animate attributeName="width" values="0;0;790;790" keyTimes="0;0.24;0.78;1" dur="5.8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="72" y="175" width="0" height="28"><animate attributeName="width" values="0;0;510;510" keyTimes="0;0.52;0.88;1" dur="5.8s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .float-a { animation: driftA 7s ease-in-out infinite; }
      .float-b { animation: driftB 9s ease-in-out infinite; }
      .caret { animation: blink 0.85s steps(1) infinite; }
      .output { animation: appear 5.8s ease-out infinite; }
      @keyframes driftA { 0%,100% { transform: translateY(0); opacity:.35 } 50% { transform: translateY(-10px); opacity:.8 } }
      @keyframes driftB { 0%,100% { transform: translateY(-4px); opacity:.25 } 50% { transform: translateY(8px); opacity:.7 } }
      @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
      @keyframes appear { 0%,82% { opacity:0; transform:translateY(6px) } 91%,100% { opacity:1; transform:translateY(0) } }
    </style>
  </defs>

  <rect width="1000" height="330" rx="26" fill="#050816"/>
  <circle cx="125" cy="70" r="150" fill="url(#glow)"/>
  <circle cx="875" cy="290" r="180" fill="url(#glow)" opacity=".65"/>
  <g class="mono" font-size="16" fill="#67e8f9">
    <text class="float-a" x="24" y="66">{ }</text>
    <text class="float-b" x="934" y="74">=&gt;</text>
    <text class="float-b" x="27" y="287">[ ]</text>
    <text class="float-a" x="934" y="270">&lt;/&gt;</text>
  </g>

  <rect x="42" y="30" width="916" height="270" rx="18" fill="url(#panel)" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M42 70H958" stroke="#2b354d"/>
  <circle cx="67" cy="50" r="6" fill="#ff5f57"/>
  <circle cx="89" cy="50" r="6" fill="#febc2e"/>
  <circle cx="111" cy="50" r="6" fill="#28c840"/>
  <text x="500" y="56" text-anchor="middle" class="mono" font-size="14" fill="#8b96ad">frontend@github: ~/hello-world</text>

  <g class="mono" font-size="20">
    <text x="72" y="112" clip-path="url(#line1)"><tspan fill="#c084fc">const</tspan><tspan fill="#e5e7eb"> hello = (name) </tspan><tspan fill="#67e8f9">=&gt;</tspan><tspan fill="#a7f3d0"> `Hello, ${name}!`;</tspan></text>
    <text x="72" y="154" clip-path="url(#line2)"><tspan fill="#c084fc">const</tspan><tspan fill="#e5e7eb"> stack = [</tspan><tspan fill="#f9a8d4">"React"</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#f9a8d4">"Next.js"</tspan><tspan fill="#e5e7eb">, </tspan><tspan fill="#f9a8d4">"TypeScript"</tspan><tspan fill="#e5e7eb">];</tspan></text>
    <text x="72" y="196" clip-path="url(#line3)"><tspan fill="#60a5fa">console</tspan><tspan fill="#e5e7eb">.log(hello(</tspan><tspan fill="#f9a8d4">"World"</tspan><tspan fill="#e5e7eb">));</tspan></text>
  </g>

  <g class="output mono" filter="url(#softGlow)">
    <text x="72" y="252" font-size="29" font-weight="700" fill="#67e8f9">Hello, World!</text>
    <rect class="caret" x="292" y="229" width="12" height="29" rx="2" fill="#a78bfa"/>
  </g>
  <text x="72" y="279" class="mono" font-size="14" fill="#64748b">// building the web, one thoughtful component at a time</text>
</svg>

