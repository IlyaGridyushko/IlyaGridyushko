    <g><text class="bit bit-dim" x="282" y="102"><tspan x="282">1</tspan><tspan x="282" dy="14">0</tspan><tspan x="282" dy="14">1</tspan><tspan x="282" dy="14">0</tspan><tspan x="282" dy="14">0</tspan><tspan x="282" dy="14">1</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -30;0 -30;0 124;0 160" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit" x="326" y="62"><tspan x="326">0</tspan><tspan x="326" dy="14">1</tspan><tspan x="326" dy="14">0</tspan><tspan x="326" dy="14">0</tspan><tspan x="326" dy="14">1</tspan><tspan x="326" dy="14">1</tspan><tspan x="326" dy="14">0</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -12;0 -12;0 144;0 180" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit bit-dim" x="370" y="126"><tspan x="370">1</tspan><tspan x="370" dy="14">0</tspan><tspan x="370" dy="14">1</tspan><tspan x="370" dy="14">1</tspan><tspan x="370" dy="14">0</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -38;0 -38;0 108;0 148" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit" x="414" y="79"><tspan x="414">0</tspan><tspan x="414" dy="14">1</tspan><tspan x="414" dy="14">1</tspan><tspan x="414" dy="14">0</tspan><tspan x="414" dy="14">1</tspan><tspan x="414" dy="14">0</tspan><tspan x="414" dy="14">0</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -22;0 -22;0 138;0 174" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit bit-dim" x="458" y="96"><tspan x="458">1</tspan><tspan x="458" dy="14">0</tspan><tspan x="458" dy="14">0</tspan><tspan x="458" dy="14">1</tspan><tspan x="458" dy="14">1</tspan><tspan x="458" dy="14">0</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -28;0 -28;0 126;0 164" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit" x="508" y="69"><tspan x="508">0</tspan><tspan x="508" dy="14">1</tspan><tspan x="508" dy="14">0</tspan><tspan x="508" dy="14">1</tspan><tspan x="508" dy="14">0</tspan><tspan x="508" dy="14">1</tspan><tspan x="508" dy="14">1</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -16;0 -16;0 150;0 186" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit bit-dim" x="558" y="119"><tspan x="558">1</tspan><tspan x="558" dy="14">1</tspan><tspan x="558" dy="14">0</tspan><tspan x="558" dy="14">0</tspan><tspan x="558" dy="14">1</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -36;0 -36;0 112;0 150" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
