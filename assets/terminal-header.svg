    <g><text class="bit" x="822" y="72"><tspan x="822">0</tspan><tspan x="822" dy="14">1</tspan><tspan x="822" dy="14">0</tspan><tspan x="822" dy="14">1</tspan><tspan x="822" dy="14">1</tspan><tspan x="822" dy="14">0</tspan><tspan x="822" dy="14">1</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -18;0 -18;0 146;0 182" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit bit-dim" x="876" y="99"><tspan x="876">1</tspan><tspan x="876" dy="14">1</tspan><tspan x="876" dy="14">0</tspan><tspan x="876" dy="14">0</tspan><tspan x="876" dy="14">1</tspan><tspan x="876" dy="14">0</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -29;0 -29;0 124;0 162" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="bit" x="930" y="61"><tspan x="930">0</tspan><tspan x="930" dy="14">1</tspan><tspan x="930" dy="14">0</tspan><tspan x="930" dy="14">0</tspan><tspan x="930" dy="14">1</tspan><tspan x="930" dy="14">1</tspan><tspan x="930" dy="14">0</tspan></text><animateTransform attributeName="transform" type="translate" values="0 -12;0 -12;0 150;0 186" keyTimes="0;.76;.91;1" dur="10s" repeatCount="indefinite"/></g>
